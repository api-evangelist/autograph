name: Autograph
description: Autograph is a fan engagement and digital collectibles platform co-founded by Tom Brady and
  operated by LFG NFTs Corp. It recognizes and rewards fans by turning their passion for athletes, artists,
  and celebrities into access, experiences, and exclusive rewards. The platform consolidates fan communities
  and content into a single app, using web3 and NFT technology to let creators and public figures collaborate
  directly with their supporters. Autograph is a consumer product with no public developer API program at
  this time; api.autograph.io serves the app backend and docs.autograph.io is a private GitBook.
